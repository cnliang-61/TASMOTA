<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasmota 遠端控制面板</title>
  <!-- 引入 MQTT.js 函式庫 -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg-color: #1e1e2e;
      --card-bg: #2b2b3d;
      --accent-color: #89b4fa;
      --text-color: #cdd6f4;
      --inactive-tab: #313244;
      --tasmota-green: #2ecc71;
      --tasmota-green-hover: #27ae60;
      
      /* 色彩定義 */
      --custom-green: #00964B; /* 開啟 */
      --custom-red: #FF0000;   /* 關閉 */
      --custom-grey: #7B8483;  /* 離線 */
      --custom-blue: #82ACFA;  /* 運作中按鈕變色 */
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
    }
    h1 { text-align: center; color: var(--accent-color); margin-bottom: 20px; }

    /* 頁籤選單 (Tabs Header) */
    .tab-header {
      display: flex;
      gap: 5px;
      margin-bottom: 15px;
    }
    .tab-btn {
      flex: 1;
      padding: 12px 8px;
      background-color: var(--inactive-tab);
      color: var(--text-color);
      border: none;
      border-radius: 8px 8px 0 0;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
    }
    .tab-btn.active {
      background-color: var(--card-bg);
      color: var(--accent-color);
      border-bottom: 3px solid var(--accent-color);
    }

    /* 頁籤內容 (Tab Content) */
    .tab-content {
      display: none;
      background-color: var(--card-bg);
      border-radius: 0 0 12px 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }
    .tab-content.active {
      display: block;
    }

    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 0.9rem; }
    input, select, button {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #45475a;
      background-color: #181825;
      color: #fff;
      box-sizing: border-box;
      font-size: 1rem;
    }
    
    .btn-secondary { 
      background-color: #45475a; 
      color: #fff; 
      border: none; 
      font-weight: bold; 
      cursor: pointer; 
      padding: 12px;
      border-radius: 6px;
      margin-top: 15px;
      transition: background-color 0.2s;
    }
    .btn-secondary:hover { background-color: #585b70; }

    /* 雙欄剩餘時間視窗容器 */
    .remaining-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 15px;
    }

    /* 剩餘時間顯示視窗 */
    .remaining-window {
      background-color: #181825;
      border: 1px solid #45475a;
      border-radius: 6px;
      padding: 10px 4px;
      text-align: center;
      font-weight: bold;
      color: var(--accent-color);
      font-size: 0.9rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 左右雙欄版面佈局 */
    .control-grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 15px;
    }
    .control-column {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .control-column button {
      padding: 14px 4px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: bold;
    }

    /* 情境/加壓按鈕樣式 */
    .btn-boil {
      background-color: #181825;
      border: 1px solid #45475a;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-boil:hover {
      background-color: #313244;
    }
    .btn-boil:active {
      background-color: #45475a;
    }

    /* 狀態看板樣式 */
    .status-bar {
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
      margin-top: 15px;
      background-color: #181825;
    }
    .device-status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 15px;
    }
    
    /* 框外標題 */
    .device-outside-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--text-color);
      text-align: center;
      margin-bottom: 8px;
    }

    /* 控制方框容器 */
    .device-box {
      background-color: #181825;
      padding: 16px 8px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid #45475a;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.2s, transform 0.1s;
    }
    .device-box:hover {
      background-color: #242438;
      border-color: #585b70;
    }
    .device-box:active {
      transform: scale(0.98);
    }
    
    /* 單一圖示與狀態顯示列 (文字大小縮小一半) */
    .status-single-row { 
      font-size: 1.575rem;
      font-weight: bold;
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px; 
    }
    
    /* 電源圖示 (大小縮小一半) */
    .power-icon {
      width: 33px;
      height: 33px;
      vertical-align: middle;
      transition: fill 0.3s ease;
    }
    
    /* 色彩對應 */
    .status-green { color: var(--custom-green); fill: var(--custom-green); }
    .status-red { color: var(--custom-red); fill: var(--custom-red); }
    .status-grey { color: var(--custom-grey); fill: var(--custom-grey); }

    .section-title { font-size: 1.1rem; border-bottom: 1px solid #45475a; padding-bottom: 8px; margin-top: 0; margin-bottom: 12px; }

    /* --- Tasmota 定時器面板 --- */
    .tasmota-fieldset {
      border: 2px solid #585b70;
      border-radius: 8px;
      padding: 15px;
      background-color: #181825;
      margin-top: 10px;
    }
    .tasmota-fieldset legend {
      color: #cdd6f4;
      font-weight: bold;
      padding: 0 8px;
      font-size: 1rem;
    }
    .tasmota-enable-top {
      text-align: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #45475a;
      margin-bottom: 15px;
      font-weight: bold;
    }
    .timer-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
      margin-bottom: 15px;
    }
    .timer-num-btn {
      padding: 8px 0;
      background-color: #45475a;
      color: #a6adc8;
      border: 1px solid #585b70;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.9rem;
      cursor: pointer;
      text-align: center;
    }
    .timer-num-btn.active {
      background-color: var(--accent-color);
      color: #11111b;
      border-color: #b4befe;
    }
    .inline-row {
      display: flex;
      align-items: center;
      justify-content: space-around;
      margin-bottom: 15px;
      gap: 10px;
    }
    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .checkbox-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent-color);
      cursor: pointer;
    }
    
    .action-toggle-group {
      display: flex;
      gap: 10px;
    }
    .action-btn {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #45475a;
      background-color: #1e1e2e;
      color: #a6adc8;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .action-btn.active-on {
      background-color: var(--custom-green);
      color: #ffffff;
      border-color: var(--custom-green);
    }
    .action-btn.active-off {
      background-color: var(--custom-red);
      color: #ffffff;
      border-color: var(--custom-red);
    }

    .week-days-grid {
      display: flex;
      justify-content: flex-start;
      flex-wrap: wrap;
      gap: 6px;
      margin: 15px 0;
      padding: 10px;
      background-color: #1e1e2e;
      border-radius: 6px;
    }
    .day-btn input[type="checkbox"] {
      display: none;
    }
    .day-btn span {
      display: inline-block;
      min-width: 36px;
      padding: 8px 0;
      background-color: #45475a;
      color: #a6adc8;
      border: 1px solid #585b70;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.9rem;
      text-align: center;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }
    .day-btn input[type="checkbox"]:checked + span {
      background-color: var(--accent-color);
      color: #11111b;
      border-color: #b4befe;
    }

    .btn-save-tasmota {
      background-color: var(--tasmota-green);
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      padding: 12px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    .btn-save-tasmota:hover {
      background-color: var(--tasmota-green-hover);
    }
    .loading-hint {
      text-align: center;
      font-size: 0.85rem;
      color: #f9e2af;
      margin-bottom: 8px;
      min-height: 20px;
    }

    .custom-time-picker {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .custom-time-picker select {
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>WIFI開關控制面板</h1>

  <!-- 頁籤按鈕區 -->
  <div class="tab-header">
    <button class="tab-btn active" onclick="switchTab(0)">連線與狀態</button>
    <button class="tab-btn" onclick="switchTab(1)">即時控制</button>
    <button class="tab-btn" onclick="switchTab(2)">定時器設定</button>
  </div>

  <!-- 分頁 1: HiveMQ Cloud 連線設定 -->
  <div class="tab-content active">
    <h2 class="section-title">HiveMQ Cloud 連線設定</h2>
    <div class="form-group">
      <label>Cluster Host（不要加 wss://）：</label>
      <input type="text" id="host" value="625f8a43c90c4cdcb582516b174b7193.s1.eu.hivemq.cloud">
    </div>
    <div class="form-group">
      <label>Port (WebSocket SSL)：</label>
      <input type="number" id="port" value="8884">
    </div>
    <div class="form-group">
      <label>Username：</label>
      <input type="text" id="username" value="">
    </div>
    <div class="form-group">
      <label>Password：</label>
      <input type="password" id="password" value="">
    </div>
    <button class="btn-primary" onclick="connectMQTT()">連線至 HiveMQ</button>

    <div id="broker-status" class="status-bar status-grey">MQTT Broker：未連線</div>
  </div>

  <!-- 分頁 2: 設備狀況監控與即時控制 -->
  <div class="tab-content">
    <h2 class="section-title">設備狀況監控與控制</h2>
    
    <div class="device-status-grid">
      <!-- 加壓馬達區塊 -->
      <div>
        <div class="device-outside-title">加壓馬達</div>
        <div class="device-box" onclick="togglePump()">
          <div class="status-single-row">
            <span id="pump-power" class="status-grey">
              <svg class="power-icon" viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg>
              離線
            </span>
          </div>
        </div>
      </div>

      <!-- 熱水器區塊 -->
      <div>
        <div class="device-outside-title">熱水器</div>
        <div class="device-box" onclick="toggleHeater()">
          <div class="status-single-row">
            <span id="heater-power" class="status-grey">
              <svg class="power-icon" viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg>
              離線
            </span>
          </div>
        </div>
      </div>
    </div>

    <!-- 雙欄剩餘時間視窗 (加壓馬達剩餘時間 + 煮水剩餘時間) -->
    <div class="remaining-grid">
      <div id="pump-remaining-display" class="remaining-window">⏳ 加壓馬達剩餘時間：00:00</div>
      <div id="heater-remaining-display" class="remaining-window">⏳ 煮水剩餘時間：00:00</div>
    </div>

    <!-- 重新整理最新狀態按鈕 -->
    <button class="btn-secondary" onclick="refreshStatus()">🔄 重新整理最新狀態</button>

    <!-- 左右雙欄控制按鈕區塊 -->
    <div class="control-grid-container">
      <!-- 左欄：加壓控制 -->
      <div class="control-column">
        <h2 class="section-title">加壓控制</h2>
        <button class="btn-boil" onclick="publishCmd('cmnd/pump/Backlog', 'PulseTime1 700; POWER ON')">加壓十分鐘</button>
        <button class="btn-boil" onclick="publishCmd('cmnd/pump/Backlog', 'PulseTime1 1300; POWER ON')">加壓二十分鐘</button>
      </div>

      <!-- 右欄：煮水情境控制 -->
      <div class="control-column">
        <h2 class="section-title">煮水情境控制</h2>
        <button class="btn-boil" onclick="publishCmd('cmnd/pump/Backlog', 'PulseTime1 410; POWER ON; Delay 110; Publish cmnd/heater/POWER ON')">煮水五分鐘</button>
        <button class="btn-boil" onclick="publishCmd('cmnd/pump/Backlog', 'PulseTime1 710; POWER ON; Delay 110; Publish cmnd/heater/POWER ON')">煮水十分鐘</button>
      </div>
    </div>
  </div>

  <!-- 分頁 3: 仿 Tasmota 原生定時器介面 -->
  <div class="tab-content">
    <div class="form-group">
      <label style="font-weight: bold; font-size: 1rem;">控制對象：</label>
      <select id="timer-device" style="background-color: #2b2b3d; font-weight: bold;" onchange="onDeviceOrTimerChange()">
        <option value="pump">加壓馬達開關</option>
        <option value="heater">熱水器開關</option>
      </select>
    </div>

    <fieldset class="tasmota-fieldset">
      <legend>定時器參數</legend>

      <div class="tasmota-enable-top">
        <label class="checkbox-label">
          <input type="checkbox" id="enable-all-timers">
          <span>啟用全域定時功能</span>
        </label>
      </div>

      <div class="timer-grid" id="timer-num-selector"></div>

      <div id="loading-hint" class="loading-hint"></div>

      <div class="form-group">
        <label>動作</label>
        <input type="hidden" id="timer-action" value="1">
        <div class="action-toggle-group">
          <button type="button" id="btn-action-on" class="action-btn active-on" onclick="setTimerAction(1)">開啟</button>
          <button type="button" id="btn-action-off" class="action-btn" onclick="setTimerAction(0)">關閉</button>
        </div>
      </div>

      <div class="inline-row">
        <label class="checkbox-label">
          <input type="checkbox" id="timer-single-enable">
          <span>啟用此定時器</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="timer-repeat">
          <span>重複</span>
        </label>
      </div>

      <div class="form-group">
        <label>觸發時間</label>
        <div class="custom-time-picker">
          <select id="timer-ampm" style="flex: 1;">
            <option value="AM">上午 (AM)</option>
            <option value="PM" selected>下午 (PM)</option>
          </select>
          <select id="timer-hour" style="flex: 1;"></select>
          <span style="font-weight: bold; font-size: 1.2rem;">:</span>
          <select id="timer-minute" style="flex: 1;"></select>
        </div>
      </div>

      <div class="week-days-grid">
        <label class="day-btn"><input type="checkbox" class="day-check" value="0"><span>日</span></label>
        <label class="day-btn"><input type="checkbox" class="day-check" value="1"><span>一</span></label>
        <label class="day-btn"><input type="checkbox" class="day-check" value="2"><span>二</span></label>
        <label class="day-btn"><input type="checkbox" class="day-check" value="3"><span>三</span></label>
        <label class="day-btn"><input type="checkbox" class="day-check" value="4"><span>四</span></label>
        <label class="day-btn"><input type="checkbox" class="day-check" value="5"><span>五</span></label>
        <label class="day-btn"><input type="checkbox" class="day-check" value="6"><span>六</span></label>
      </div>

      <button class="btn-save-tasmota" onclick="saveTasmotaTimer()">儲存設定</button>
    </fieldset>
  </div>
</div>

<script>
  let client = null;
  let selectedTimerId = 1;
  
  /* 加壓馬達與熱水器各自的倒數計時器 */
  let pumpTimer = null;
  let pumpCurrentRemaining = 0;

  let heaterTimer = null;
  let heaterCurrentRemaining = 0;

  const powerIconSvg = `<svg class="power-icon" viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg>`;

  /* 將總秒數轉換為 分:秒 (MM:SS) 格式 */
  function formatTime(totalSeconds) {
    if (isNaN(totalSeconds) || totalSeconds <= 0) return "00:00";
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }

  function initTimePickerOptions() {
    const hourSelect = document.getElementById('timer-hour');
    const minSelect = document.getElementById('timer-minute');

    hourSelect.innerHTML = '';
    minSelect.innerHTML = '';

    for (let h = 1; h <= 12; h++) {
      const val = h.toString().padStart(2, '0');
      const opt = document.createElement('option');
      opt.value = val;
      opt.innerText = val + ' 時';
      if (h === 6) opt.selected = true;
      hourSelect.appendChild(opt);
    }

    for (let m = 0; m < 60; m++) {
      const val = m.toString().padStart(2, '0');
      const opt = document.createElement('option');
      opt.value = val;
      opt.innerText = val + ' 分';
      if (m === 30) opt.selected = true;
      minSelect.appendChild(opt);
    }
  }

  function initTimerGrid() {
    const grid = document.getElementById('timer-num-selector');
    grid.innerHTML = '';
    for (let i = 1; i <= 16; i++) {
      const btn = document.createElement('div');
      btn.className = `timer-num-btn ${i === selectedTimerId ? 'active' : ''}`;
      btn.innerText = i;
      btn.onclick = () => {
        selectedTimerId = i;
        document.querySelectorAll('.timer-num-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        onDeviceOrTimerChange();
      };
      grid.appendChild(btn);
    }
  }
  
  function setTimerAction(val) {
    document.getElementById('timer-action').value = val;
    const btnOn = document.getElementById('btn-action-on');
    const btnOff = document.getElementById('btn-action-off');

    if (val === 1 || val === "1") {
      btnOn.className = 'action-btn active-on';
      btnOff.className = 'action-btn';
    } else {
      btnOn.className = 'action-btn';
      btnOff.className = 'action-btn active-off';
    }
  }

  initTimePickerOptions();
  initTimerGrid();

  function switchTab(index) {
    const tabs = document.querySelectorAll('.tab-btn');
    const contents = document.querySelectorAll('.tab-content');
    tabs.forEach((tab, i) => {
      if (i === index) {
        tab.classList.add('active');
        contents[i].classList.add('active');
      } else {
        tab.classList.remove('active');
        contents[i].classList.remove('active');
      }
    });

    if (index === 2) {
      onDeviceOrTimerChange();
    }
  }

  function connectMQTT() {
    const host = document.getElementById('host').value.trim();
    const port = document.getElementById('port').value.trim();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!host || !username || !password) {
      alert('請填寫完整的 HiveMQ 連線資訊！');
      return;
    }

    const connectUrl = `wss://${host}:${port}/mqtt`;
    const clientId = 'web_client_' + Math.random().toString(16).substr(2, 8);

    document.getElementById('broker-status').innerText = 'MQTT Broker：連線中...';

    client = mqtt.connect(connectUrl, {
      clientId: clientId,
      username: username,
      password: password,
      clean: true,
      connectTimeout: 5000,
      reconnectPeriod: 2000,
    });

    client.on('connect', () => {
      const brokerDiv = document.getElementById('broker-status');
      brokerDiv.innerText = 'MQTT Broker：🟢 正常連線中';
      brokerDiv.className = 'status-bar status-green';

      client.subscribe('tele/pump/LWT');
      client.subscribe('tele/heater/LWT');
      client.subscribe('stat/pump/+');
      client.subscribe('stat/heater/+');
      client.subscribe('tele/pump/STATE');
      client.subscribe('tele/heater/STATE');

      refreshStatus();
    });

    client.on('message', (topic, message) => {
      const msgStr = message.toString();

      if (topic === 'tele/pump/LWT' && msgStr.toLowerCase() === 'offline') {
        updatePowerUI('pump-power', 'OFFLINE');
      }
      if (topic === 'tele/heater/LWT' && msgStr.toLowerCase() === 'offline') {
        updatePowerUI('heater-power', 'OFFLINE');
      }

      if (topic.includes('/pump/')) {
        parsePowerState('pump-power', topic, msgStr);
        parsePulseTimeRemaining('pump', topic, msgStr);
      }
      if (topic.includes('/heater/')) {
        parsePowerState('heater-power', topic, msgStr);
        parsePulseTimeRemaining('heater', topic, msgStr);
      }

      parseTimerState(topic, msgStr);
    });

    client.on('error', (err) => {
      console.error('Connection error: ', err);
      const brokerDiv = document.getElementById('broker-status');
      brokerDiv.innerText = 'MQTT Broker：🔴 連線失敗';
      brokerDiv.className = 'status-bar status-red';
    });

    client.on('offline', () => {
      const brokerDiv = document.getElementById('broker-status');
      brokerDiv.innerText = 'MQTT Broker：🔴 已離線';
      brokerDiv.className = 'status-bar status-red';
      updatePowerUI('pump-power', 'OFFLINE');
      updatePowerUI('heater-power', 'OFFLINE');
      startRemainingCountdown('pump', 0);
      startRemainingCountdown('heater', 0);
    });
  }

  /* 解析 PulseTime 的 Remaining 剩餘秒數 (支援 stat/heater/RESULT 等) */
  function parsePulseTimeRemaining(device, topic, msgStr) {
    try {
      const json = JSON.parse(msgStr);
      let remSec = null;

      if (json.PulseTime1 !== undefined) {
        let val = json.PulseTime1;
        if (typeof val === 'object' && val.Remaining !== undefined) {
          val = val.Remaining;
        }

        if (typeof val === 'number') {
          if (val > 100) {
            remSec = val - 100;
          } else {
            remSec = Math.floor(val / 10);
          }
        }
      }

      if (remSec !== null) {
        startRemainingCountdown(device, remSec);
      }
    } catch (e) {
    }
  }

  /* 更新剩餘時間顯示框 (分:秒) 並啟動前端倒數 */
  function startRemainingCountdown(device, seconds) {
    const displayEl = document.getElementById(`${device}-remaining-display`);
    const prefix = device === 'pump' ? '⏳ 加壓馬達剩餘時間：' : '⏳ 煮水剩餘時間：';

    if (device === 'pump') {
      if (pumpTimer) clearInterval(pumpTimer);
      pumpCurrentRemaining = parseInt(seconds, 10);

      if (isNaN(pumpCurrentRemaining) || pumpCurrentRemaining <= 0) {
        pumpCurrentRemaining = 0;
        displayEl.innerText = `${prefix}00:00`;
        return;
      }

      displayEl.innerText = `${prefix}${formatTime(pumpCurrentRemaining)}`;

      pumpTimer = setInterval(() => {
        pumpCurrentRemaining--;
        if (pumpCurrentRemaining <= 0) {
          pumpCurrentRemaining = 0;
          clearInterval(pumpTimer);
          displayEl.innerText = `${prefix}00:00`;
        } else {
          displayEl.innerText = `${prefix}${formatTime(pumpCurrentRemaining)}`;
        }

        // 當加壓馬達倒數更新時，若熱水器處於開啟狀態，同步更新煮水剩餘時間
        const heaterPowerEl = document.getElementById('heater-power');
        if (heaterPowerEl && heaterPowerEl.innerText.includes('開啟')) {
          const heaterDisplayEl = document.getElementById('heater-remaining-display');
          heaterDisplayEl.innerText = `⏳ 煮水剩餘時間：${formatTime(pumpCurrentRemaining)}`;
        }
      }, 1000);

    } else if (device === 'heater') {
      if (heaterTimer) clearInterval(heaterTimer);
      heaterCurrentRemaining = parseInt(seconds, 10);

      if (isNaN(heaterCurrentRemaining) || heaterCurrentRemaining <= 0) {
        heaterCurrentRemaining = 0;
        displayEl.innerText = `${prefix}00:00`;
        return;
      }

      displayEl.innerText = `${prefix}${formatTime(heaterCurrentRemaining)}`;

      heaterTimer = setInterval(() => {
        heaterCurrentRemaining--;
        if (heaterCurrentRemaining <= 0) {
          heaterCurrentRemaining = 0;
          clearInterval(heaterTimer);
          displayEl.innerText = `${prefix}00:00`;
        } else {
          displayEl.innerText = `${prefix}${formatTime(heaterCurrentRemaining)}`;
        }
      }, 1000);
    }
  }

  function onDeviceOrTimerChange() {
    if (!client || !client.connected) return;

    const device = document.getElementById('timer-device').value;
    document.getElementById('loading-hint').innerText = `⏳ 正在載入【${device === 'pump' ? '加壓馬達' : '熱水器'}】Timer ${selectedTimerId} 設定...`;

    client.publish(`cmnd/${device}/Timers`, '');
    client.publish(`cmnd/${device}/Timer${selectedTimerId}`, '');
  }

  function parseTimerState(topic, msgStr) {
    const currentDevice = document.getElementById('timer-device').value;
    if (!topic.includes(`/${currentDevice}/`)) return;

    try {
      const json = JSON.parse(msgStr);
      
      if (json.Timers !== undefined) {
        const isTimersOn = (json.Timers === "ON" || json.Timers === 1 || json.Timers === "1" || json.Timers === true);
        document.getElementById('enable-all-timers').checked = isTimersOn;
      }

      let timerData = null;
      const keyName = `Timer${selectedTimerId}`;

      if (json[keyName]) {
        timerData = json[keyName];
      } else if (json.Arm !== undefined || json.Enable !== undefined) {
        timerData = json;
      }

      if (timerData) {
        document.getElementById('loading-hint').innerText = `✅ 已讀取 Timer ${selectedTimerId} 最新設定！`;
        setTimeout(() => { document.getElementById('loading-hint').innerText = ''; }, 3000);

        const isArmed = timerData.Arm !== undefined ? timerData.Arm === 1 : timerData.Enable === 1;
        document.getElementById('timer-single-enable').checked = isArmed;

        if (timerData.Time) {
          const parts = timerData.Time.split(':');
          if (parts.length === 2) {
            let h = parseInt(parts[0], 10);
            const m = parts[1];
            let ampm = 'AM';

            if (h >= 12) {
              ampm = 'PM';
              if (h > 12) h -= 12;
            } else if (h === 0) {
              h = 12;
            }

            document.getElementById('timer-ampm').value = ampm;
            document.getElementById('timer-hour').value = h.toString().padStart(2, '0');
            document.getElementById('timer-minute').value = m;
          }
        }

        if (timerData.Action !== undefined) {
          setTimerAction(timerData.Action);
        }

        if (timerData.Repeat !== undefined) {
          document.getElementById('timer-repeat').checked = (timerData.Repeat === 1);
        }

        if (timerData.Days) {
          parseDaysMask(timerData.Days);
        }
      }
    } catch (e) {
    }
  }

  function parseDaysMask(days) {
    const dayChecks = document.querySelectorAll('.day-check');
    
    if (/^[01]{7}$/.test(days)) {
      for (let i = 0; i < 7; i++) {
        dayChecks[i].checked = (days[i] === '1');
      }
    } else {
      for (let i = 0; i < 7; i++) {
        if (days[i] && days[i] !== '-' && days[i] !== '0') {
          dayChecks[i].checked = true;
        } else {
          dayChecks[i].checked = false;
        }
      }
    }
  }

  function refreshStatus() {
    if (!client || !client.connected) {
      alert('請先連線至 HiveMQ！');
      return;
    }
    client.publish('cmnd/pump/POWER', '');
    client.publish('cmnd/heater/POWER', '');
    client.publish('cmnd/pump/PulseTime1', '');
    client.publish('cmnd/heater/PulseTime1', '');
    client.publish('cmnd/pump/State', '');
    client.publish('cmnd/heater/State', '');
  }

  function parsePowerState(elementId, topic, msgStr) {
    let powerState = '';

    if (topic.endsWith('/POWER') || topic.endsWith('/POWER1')) {
      powerState = msgStr;
    } else {
      try {
        const json = JSON.parse(msgStr);
        if (json.POWER !== undefined) powerState = json.POWER;
        else if (json.POWER1 !== undefined) powerState = json.POWER1;
      } catch (e) {
      }
    }

    if (powerState) {
      updatePowerUI(elementId, powerState);

      // 判斷熱水器狀態以決定「煮水剩餘時間」
      if (elementId === 'heater-power') {
        const upperState = powerState.toUpperCase();

        if (upperState === 'ON') {
          // 當熱水器開啟時，同步加壓馬達目前的剩餘時間
          startRemainingCountdown('heater', pumpCurrentRemaining);
        } else {
          // 當熱水器關閉或離線時，煮水剩餘時間歸零並顯示 00:00
          startRemainingCountdown('heater', 0);
        }
      }
    }
  }

  function updatePowerUI(elementId, powerText) {
    const el = document.getElementById(elementId);
    const upperText = powerText.toUpperCase();
    
    if (upperText === 'ON') {
      el.innerHTML = `${powerIconSvg} 開啟`;
      el.className = 'status-green';
    } else if (upperText === 'OFF') {
      el.innerHTML = `${powerIconSvg} 關閉`;
      el.className = 'status-red';
      
      if (elementId === 'pump-power') startRemainingCountdown('pump', 0);
      if (elementId === 'heater-power') startRemainingCountdown('heater', 0);
    } else {
      el.innerHTML = `${powerIconSvg} 離線`;
      el.className = 'status-grey';
      
      if (elementId === 'pump-power') startRemainingCountdown('pump', 0);
      if (elementId === 'heater-power') startRemainingCountdown('heater', 0);
    }
  }

  function publishCmd(topic, payload) {
    if (!client || !client.connected) {
      alert('請先連線至 HiveMQ！');
      return;
    }
    client.publish(topic, payload, { qos: 0 });
  }

  function togglePump() {
    const el = document.getElementById('pump-power');
    const isCurrentlyOn = el.innerText.includes('開啟');
    
    if (isCurrentlyOn) {
      publishCmd('cmnd/pump/POWER', 'OFF');
    } else {
      publishCmd('cmnd/pump/Backlog', 'PulseTime1 0; POWER ON');
    }
  }

  function toggleHeater() {
    const el = document.getElementById('heater-power');
    const isCurrentlyOn = el.innerText.includes('開啟');
    
    if (isCurrentlyOn) {
      publishCmd('cmnd/pump/Backlog', 'POWER OFF; Delay 100; POWER ON');
    } else {
      publishCmd('cmnd/pump/Backlog', 'PulseTime1 0; POWER ON; Delay 110; Publish cmnd/heater/POWER ON');
    }
  }

  function saveTasmotaTimer() {
    const device = document.getElementById('timer-device').value;
    const enableAll = document.getElementById('enable-all-timers').checked ? 1 : 0;
    const singleEnable = document.getElementById('timer-single-enable').checked ? 1 : 0;
    const repeat = document.getElementById('timer-repeat').checked ? 1 : 0;
    const action = parseInt(document.getElementById('timer-action').value);
    
    const ampm = document.getElementById('timer-ampm').value;
    let h = parseInt(document.getElementById('timer-hour').value, 10);
    const m = document.getElementById('timer-minute').value;

    if (ampm === 'PM' && h < 12) h += 12;
    if (ampm === 'AM' && h === 12) h = 0;

    const timeVal = `${h.toString().padStart(2, '0')}:${m}`;

    const dayChecks = document.querySelectorAll('.day-check');
    let daysArray = ['0','0','0','0','0','0','0'];
    dayChecks.forEach(chk => {
      if (chk.checked) {
        daysArray[parseInt(chk.value)] = '1';
      }
    });
    const daysStr = daysArray.join('');

    const timerPayload = JSON.stringify({
      Enable: singleEnable,
      Mode: 0,
      Time: timeVal,
      Window: 0,
      Days: daysStr,
      Repeat: repeat,
      Output: 1,
      Action: action
    });

    publishCmd(`cmnd/${device}/Timers`, enableAll.toString());
    publishCmd(`cmnd/${device}/Timer${selectedTimerId}`, timerPayload);

    const displayTime = `${ampm} ${document.getElementById('timer-hour').value}:${m} (24H: ${timeVal})`;
    alert(`已儲存【${device === 'pump' ? '加壓馬達' : '熱水器'}】Timer ${selectedTimerId} 設定！\n觸發時間：${displayTime}`);
  }
</script>
